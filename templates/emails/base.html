{% load loja %}<!doctype html><html lang="pt-BR"><body style="margin:0;background:#f4f6f9;font-family:Arial,Helvetica,sans-serif;color:#1b2430">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center" style="padding:24px 12px">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border:1px solid #d3dae4;border-radius:10px">
<tr><td style="background:#1f3a5f;color:#ffffff;padding:16px 24px;border-radius:10px 10px 0 0"><strong style="font-size:16px">{{ loja.nome }}</strong>{% if loja.numero %}<br><span style="font-size:12px;opacity:.85">Nº {{ loja.numero }}{% if loja.oriente %} · Oriente de {{ loja.oriente }}{% endif %}</span>{% endif %}</td></tr>
<tr><td style="padding:24px;font-size:15px;line-height:1.6">{{ corpo|urlizetrunc:60|linebreaks }}</td></tr>
<tr><td style="padding:12px 24px 20px;font-size:12px;color:#566274;border-top:1px solid #e3e8ef">{{ loja.potencia }} · Mensagem automática do sistema da Loja.</td></tr>
</table></td></tr></table></body></html>
