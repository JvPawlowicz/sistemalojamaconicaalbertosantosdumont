{% extends "base.html" %}{% load loja %}{% block publico %}
<div class="login-wrap"><div class="card login-card"><h1>Recuperar senha</h1>
<p>Informe o e-mail cadastrado. Enviaremos um link para definir uma nova senha.</p>
<form method="post">{% csrf_token %}<div class="campo"><label for="id_email">E-mail</label><input class="input" type="email" name="email" id="id_email" required autofocus></div>
<button class="btn" type="submit">{% icon "mail" %} Enviar link</button> <a class="btn btn-sec" href="{% url 'login' %}">Voltar</a></form></div></div>{% endblock %}
