{% extends "base.html" %}{% load loja %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<div class="cabecalho-pagina"><h1>{{ titulo }}</h1></div>
<form method="post" class="card" {% if multipart or form.is_multipart %}enctype="multipart/form-data"{% endif %} novalidate>
  {% csrf_token %}
  {% include "partials/form.html" %}
  <div class="barra-acoes"><button class="btn" type="submit">{% icon "check" %} Salvar</button>{% if cancelar_url %}<a class="btn btn-sec" href="{{ cancelar_url }}">Cancelar</a>{% endif %}</div>
</form>
{% endblock %}
