<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Esquadro e compasso">
  <title>Esquadro e compasso</title>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- esquadro: vértice embaixo, braços a 45° -->
    <path d="M60 104 L16 60 M60 104 L104 60" stroke="#0a6aa1" stroke-width="7"/>
    <path d="M60 104 L16 60 M60 104 L104 60" stroke="#8fd0f2" stroke-width="2.4" stroke-dasharray="1 9"/>
    <!-- compasso: charneira em cima, pernas abertas -->
    <path d="M60 12 L26 88 M60 12 L94 88" stroke="#0b3a58" stroke-width="6"/>
    <circle cx="60" cy="14" r="6.5" fill="#ffffff" stroke="#0b3a58" stroke-width="4.5"/>
    <path d="M26 88 L22 99 M94 88 L98 99" stroke="#0b3a58" stroke-width="4"/>
    <path d="M40 54 Q60 44 80 54" stroke="#0b3a58" stroke-width="3.2"/>
  </g>
  <circle cx="60" cy="66" r="15" fill="#e6f4fb" stroke="#0a6aa1" stroke-width="3"/>
  <text x="60" y="73" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="21" fill="#0b3a58">G</text>
</svg>
