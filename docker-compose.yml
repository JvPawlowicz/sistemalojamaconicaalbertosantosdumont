# Produção simples: PostgreSQL + aplicação + Caddy (HTTPS automático com Let's Encrypt).
# 1) copie .env.example para .env e preencha; 2) defina DOMINIO no .env; 3) docker compose up -d
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-loja}
      POSTGRES_USER: ${DB_USER:-loja}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
    volumes: [pgdata:/var/lib/postgresql/data]
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-loja}
      DB_USER: ${DB_USER:-loja}
      DB_PASSWORD: ${DB_PASSWORD}
      DJANGO_DEBUG: "0"
      PROXY_COUNT: "1"
      DJANGO_SSL_REDIRECT: "0"   # o Caddy já redireciona para HTTPS
    depends_on: [db]
    volumes: [media:/app/media]
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]
volumes: {pgdata: {}, media: {}, caddy_data: {}}
