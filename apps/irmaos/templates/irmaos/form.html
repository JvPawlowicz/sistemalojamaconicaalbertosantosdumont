{% extends "base.html" %}{% load loja %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block conteudo %}
<div class="cabecalho-pagina"><h1>{{ titulo }}</h1></div>
<form method="post" enctype="multipart/form-data" novalidate class="card">{% csrf_token %}
{% include "partials/form_abas.html" %}
<div class="barra-acoes"><button class="btn" type="submit">{% icon "check" %} Salvar</button><a class="btn btn-sec" href="{% url 'irmaos:lista' %}">Cancelar</a>
{% if novo %}<label class="campo-check" style="display:flex;gap:.5rem;align-items:center;margin-left:auto"><input class="check" type="checkbox" name="enviar_convite" checked> Enviar convite de senha por e-mail</label>{% endif %}</div>
</form>{% endblock %}
